<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restore · Briefcase study</title><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#1e2427;color:#ebe4d6;font:14px/1.5 system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}header{position:absolute;top:30px;left:34px;pointer-events:none}header small{color:#a8b1af;letter-spacing:.18em;text-transform:uppercase;font-size:10px}h1{font-size:25px;font-weight:450;letter-spacing:-.035em;margin:5px 0}header p{font-size:12px;color:#a8b1af;margin:0}.panel{position:absolute;left:34px;bottom:30px;max-width:calc(100vw - 68px);background:#161b1ddd;border:1px solid #ffffff13;border-radius:13px;padding:16px 18px;backdrop-filter:blur(12px)}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.row:first-child{margin-top:0}#lock-state{align-self:center;font-size:12px;color:#b8aaa0;min-width:56px}#lock-state[data-unlocked=true]{color:#c2d6b8}#sound{padding:2px 6px;font-size:10px}button{border:1px solid #58615d;border-radius:5px;background:transparent;color:#d6dfda;padding:7px 13px;cursor:pointer;font:inherit;font-size:12px}button:hover,button[aria-pressed=true]{background:#c1aa7a;color:#202522;border-color:#c1aa7a}label{font-size:12px;color:#bbc4be;display:flex;align-items:center;gap:14px;width:100%;margin-top:16px}input{accent-color:#c1aa7a;width:170px}#status{position:absolute;right:32px;bottom:27px;color:#a4b1a9;font-size:11px;text-align:right;pointer-events:none}a{color:#c4ae83}.hint{margin-top:10px;color:#8c9d95;font-size:11px}@media(max-width:640px){header{top:18px;left:20px}.panel{left:20px;bottom:18px;max-width:calc(100vw - 40px);padding:12px}#status{top:22px;right:20px;bottom:auto;max-width:100px}h1{font-size:22px}.hint{display:none}}
</style></head><body>
<canvas id="study" aria-label="Interactive retro briefcase 3D model"></canvas>
<header><small>Restore / Object study 01</small><h1>The archive case</h1><p>Worn enamel · aged metal · leather · cloth</p></header>
<section class="panel" aria-label="Model inspection controls">
<div class="row"><span id="lock-state" role="status" aria-live="polite">Locked</span><button data-lid="1" aria-pressed="false">Try latch</button><button data-lid="0" aria-pressed="true">Closed</button><button id="reset-lock">Reset lock</button></div>
<div class="row"><button data-angle="front">Front</button><button data-angle="rear">Rear / hinges</button><button data-angle="top">Above</button><button data-angle="under">Underside</button><button data-angle="detail">Lock detail</button></div>
<label>Explode assemblies <input id="explode" aria-label="Explode assemblies" type="range" min="0" max="1" step=".01" value="0"></label>
<div class="hint">Drag a wheel to turn · release to snap · tap a latch to open</div>
<div class="hint">Drag the case to orbit · scroll to inspect · <a href="./">Return to the office</a> · <button id="sound" aria-pressed="true">Sound on</button></div>
</section>
<div id="status">Loading model…</div><script type="module" src="/src/briefcase-review.js"></script></body></html>
